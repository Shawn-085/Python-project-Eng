name: ChatGPT Whisper Model Bootstrap

on:
  push:
    paths:
      - ".github/workflows/chatgpt-whisper-bootstrap.yml"

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual quantized models
        run: |
          mkdir -p bundle
          curl -L --fail --retry 5 -o bundle/ggml-base-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/98aa99a0a9db05ae2342309f5096248665f7cba3/ggml-base-q5_1.bin?download=true"
          curl -L --fail --retry 5 -o bundle/ggml-tiny-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/98aa99a0a9db05ae2342309f5096248665f7cba3/ggml-tiny-q5_1.bin?download=true"
          sha256sum bundle/*.bin | tee bundle/SHA256SUMS.txt

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: hanil-stt-fast-models
          path: bundle/
          compression-level: 0
          retention-days: 1
